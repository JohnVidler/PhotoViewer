services:
  photoviewer:
    # Runs the published image by default; `docker compose up --build` builds from source instead.
    image: ghcr.io/johnvidler/photoviewer:main
    pull_policy: missing
    build: .
    ports:
      - "3000:3000"
    volumes:
      - ./mountable/photos:/data/photos:ro
      - ./mountable/cache:/data/cache
    environment:
      PHOTOS_DIR: /data/photos
      CACHE_DIR: /data/cache
      PORT: "3000"
      # Set to "true" if changes to the photos folder aren't picked up (e.g. NFS/SMB mounts).
      WATCH_POLLING: "false"
    restart: unless-stopped
